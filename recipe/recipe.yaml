schema_version: 1

context:
  name: pytest-remotedata
  version: "0.4.1"
  git_url: https://github.com/astropy/pytest-remotedata

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 05c08bf638cdd1ed66eb01738a1647c3c714737c3ec3abe009d2c1f793b4bb59
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - pytest >=4.6
    - setuptools_scm
  run:
    - python >=${{ python_min }}
    - pytest >=4.6
    - packaging

tests:
  - python:
      imports:
        - pytest_remotedata
      pip_check: false
      python_version:
      - ${{ python_min }}.*
      - '*'
  - requirements:
      run:
        - python ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: LICENSE.rst
  summary: Pytest plugin for controlling remote data access
  description: |
    This package provides a plugin for the pytest framework that allows
    developers to control unit tests that require access to data from the
    internet.
  homepage: ${{ git_url }}
  repository: ${{ git_url }}
  documentation: ${{ git_url }}

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
    - drdavella
    - mwcraig
